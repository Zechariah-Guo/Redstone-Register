[project]
name = "redstone-register-pwa"
version = "0.1.0"
description = "Minecraft redstone component catalogue (Flask PWA)"
readme = "README.md"
# Oracle VM target is Python 3.12 (Ubuntu 24.04); local dev uses .python-version.
requires-python = ">=3.12"
# Direct dependencies only. Transitive versions are pinned in uv.lock.
dependencies = [
    "flask==3.1.3",
    "sqlalchemy==2.0.48",
    "werkzeug==3.1.9",
]

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "bandit==1.9.4",
    "pip-audit==2.10.0",
    "pytest==9.1.1",
]
# Production server only (Oracle VM): `uv sync --locked --no-dev --group prod`.
prod = [
    "gunicorn==23.0.0",
]

[tool.uv]
# The app runs from src/ and is not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
